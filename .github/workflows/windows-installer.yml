name: Build installer and publish website
on:
  workflow_dispatch:
  push:
    branches: [treasure-tracker-release]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: treasure-tracker-release
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'
      - name: Verify desktop project
        shell: pwsh
        run: |
          @('app/app.py','app/desktop_gui.py','app/dashboard.html','app/overlay.html','app/pirate-theme.png','installer/TreasureTracker.iss') | ForEach-Object {
            if (-not (Test-Path $_)) { throw "Required file missing: $_" }
          }
      - name: Check Python syntax
        run: python -m py_compile app/app.py app/desktop_gui.py app/public_link.py
      - name: Download official Cloudflare tunnel component
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools | Out-Null
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "tools/cloudflared.exe"
          if ((Get-Item "tools/cloudflared.exe").Length -lt 1000000) { throw "Cloudflare tunnel executable download is incomplete" }
          & ".\\tools\\cloudflared.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "Cloudflare tunnel executable verification failed" }
      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.16.0
      - name: Build standalone Windows app
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name TreasureTracker --add-data "app/dashboard.html;." --add-data "app/overlay.html;." --add-data "app/pirate-theme.png;." --paths app --hidden-import desktop_gui --hidden-import public_link --add-binary "tools/cloudflared.exe;." app/app.py
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Create Windows installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "installer\TreasureTracker.iss"'
      - name: Upload installer as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TreasureTracker-Desktop-Setup
          path: output/TreasureTrackerSetup.exe
          if-no-files-found: error

  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Include compiled installer in website
        uses: actions/download-artifact@v4
        with:
          name: TreasureTracker-Desktop-Setup
          path: website/downloads
      - name: Verify direct installer download
        run: test -s website/downloads/TreasureTrackerSetup.exe
      - name: Upload website and installer
        uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
