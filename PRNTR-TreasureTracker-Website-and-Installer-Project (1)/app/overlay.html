<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Fredoka:wght@500;600;700&display=swap');
*{box-sizing:border-box}
html,body{margin:0;width:620px;height:170px;overflow:hidden;background:transparent!important}
body{font-family:'Fredoka',Arial,sans-serif;padding:10px}
.panel{position:relative;width:600px;height:150px;border-radius:28px;overflow:hidden;border:2px solid rgba(255,223,162,.65);box-shadow:0 16px 28px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.22);background:url('/pirate-theme.png') center center/cover no-repeat}
.panel::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,14,18,.90) 0%,rgba(11,18,22,.72) 45%,rgba(14,20,25,.56) 100%)}
.panel::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 16% 18%,rgba(255,218,138,.25),transparent 24%),radial-gradient(circle at 83% 80%,rgba(255,255,255,.11),transparent 22%);pointer-events:none}
.bubbles,.bubbles::before,.bubbles::after{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.95),rgba(174,223,255,.18) 42%,rgba(255,255,255,0) 72%);opacity:.7;animation:floatUp 5.8s ease-in-out infinite}
.bubbles{width:24px;height:24px;right:118px;bottom:22px}
.bubbles::before{content:'';width:14px;height:14px;right:34px;bottom:22px;animation-delay:.8s}
.bubbles::after{content:'';width:18px;height:18px;right:-34px;bottom:46px;animation-delay:1.6s}
@keyframes floatUp{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.inner{position:relative;z-index:1;height:100%;display:flex;align-items:center;gap:14px;padding:14px 18px 14px 18px}
.badge{width:92px;height:92px;border-radius:24px;display:grid;place-items:center;font-size:48px;flex:0 0 auto;background:linear-gradient(180deg,rgba(255,223,160,.26),rgba(122,72,25,.22));border:1px solid rgba(255,224,169,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 8px 16px rgba(0,0,0,.22)}
.content{min-width:0;flex:1}
.kicker{font:700 14px/1 'Fredoka',Arial,sans-serif;letter-spacing:1.3px;color:#ffd99a;text-shadow:0 2px 6px rgba(0,0,0,.45);opacity:.96}
.title{margin-top:2px;font-family:'Baloo 2',cursive;font-size:38px;line-height:.95;font-weight:800;color:#fff0b9;letter-spacing:.4px;text-shadow:0 3px 0 rgba(80,44,5,.65),0 0 13px rgba(255,205,114,.35),0 7px 18px rgba(0,0,0,.44);animation:titleBob 2.8s ease-in-out infinite;transform-origin:left center}
@keyframes titleBob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-3px) rotate(1deg)}}
.row{display:flex;align-items:flex-end;gap:14px;margin-top:8px}
.group{display:flex;flex-direction:column;gap:5px;min-width:0}
.big{font-family:'Baloo 2',cursive;font-size:46px;line-height:.9;font-weight:800;color:#fffdf4;text-shadow:0 4px 12px rgba(0,0,0,.5);font-variant-numeric:tabular-nums}
.label{font:700 12px/1 'Fredoka',Arial,sans-serif;letter-spacing:1.2px;text-transform:uppercase;color:#d6ecf2;opacity:.92}
.split{width:1px;height:52px;background:linear-gradient(180deg,transparent,rgba(255,230,168,.72),transparent);margin:0 2px 3px}
.treasure{padding-left:4px}
.treasure .big{color:#9bfff1;text-shadow:0 0 12px rgba(94,255,223,.28),0 4px 12px rgba(0,0,0,.5)}
.panel.pop .badge{animation:badgePop .34s ease-out}
.panel.pop .big{animation:numberBounce .34s ease-out}
@keyframes badgePop{0%{transform:scale(1)}55%{transform:scale(1.14) rotate(-4deg)}100%{transform:scale(1)}}
@keyframes numberBounce{0%{transform:scale(1)}55%{transform:scale(1.1)}100%{transform:scale(1)}}
</style>
</head>
<body>
<div class="panel" id="panel">
  <div class="bubbles"></div>
  <div class="inner">
    <div class="badge">💎</div>
    <div class="content">
      <div class="kicker">🏴‍☠️ Live Chest Grind</div>
      <div class="title">Treasure Tracker</div>
      <div class="row">
        <div class="group">
          <div class="big" id="chests">0</div>
          <div class="label">Chests Opened</div>
        </div>
        <div class="split"></div>
        <div class="group treasure">
          <div class="big" id="tokens">0</div>
          <div class="label">Treasure Collected</div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
let count=null;async function update(){try{const response=await fetch('/api/state',{cache:'no-store'});if(!response.ok)return;const s=await response.json();if(count!==null&&s.chests>count){const e=document.getElementById('panel');e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop')}count=s.chests;document.getElementById('chests').textContent=s.chests.toLocaleString();document.getElementById('tokens').textContent=s.tokens.toLocaleString()}catch(e){}}
update();setInterval(update,250);
</script>
</body>
</html>
